name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Fetch base branch
        run: git fetch origin main --depth=1

      - name: Check comments
        run: go run ./tools/commentlint --ratchet=origin/main

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...
